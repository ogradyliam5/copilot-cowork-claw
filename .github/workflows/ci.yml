name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install and build
        working-directory: server
        run: |
          npm ci
          npm run build

  selftest:
    name: Self-test on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Caddy
        run: choco install caddy --yes --no-progress

      - name: Run claw.ps1 -SelfTest
        shell: pwsh
        run: ./claw.ps1 -SelfTest
